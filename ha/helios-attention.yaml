# Example manifest for tools/deploy_attention_dashboard.py.
#
# The entity ids below are placeholders: replace them with your own, or keep this
# file untouched and put your private copy in .local/ha/helios-attention.yaml,
# which the publisher prefers when it exists (.local/ is git-ignored).
#
# The rollout creates one light group plus a template sensor per tile, and each
# tile is shown only while its sensor has something to say.
group:
  name: Helios - lights to check
  entities:
    - light.hallway
    - light.kitchen
    - light.garage
    - light.garden
light_labels:
  light.hallway: Hallway
  light.kitchen: Kitchen
  light.garage: Garage
  light.garden: Garden
helpers:
  lights:
    name: Helios - lights on
    state: >-
      {% set labels = __LIGHT_LABELS__ %}
      {% set lit = expand('__LIGHT_GROUP__') | selectattr('state', 'eq', 'on') | list %}
      {% set result = namespace(rooms=[]) %}
      {% for lamp in lit %}
        {% set room = labels.get(lamp.entity_id, lamp.name) %}
        {% if room not in result.rooms %}{% set result.rooms = result.rooms + [room] %}{% endif %}
      {% endfor %}
      {{ (lit | count | string) ~ ' · ' ~ (result.rooms | join(', ')) if lit else '' }}
  garage:
    name: Helios - garage attention
    state: >-
      {% if is_state('binary_sensor.garage_door', 'on') %}
        Open
      {% endif %}
tiles:
  - id: clock
    type: clock
    column: 1
    row: 1
    width: 2
    height: 2
    title: Home
  - id: weather
    type: weather
    entity: weather.home
    column: 3
    row: 1
    width: 2
    height: 1
    title: Weather
  # Tapping this tile asks "Zgasic swiatla?" and turns the whole group off (schema 5).
  - id: lights-watched
    type: entity
    helper: lights
    lights_off: true
    column: 1
    row: 3
    width: 1
    height: 1
    title: Lights
    icon: lightbulb
  - id: garage-attention
    type: entity
    helper: garage
    column: 2
    row: 3
    width: 1
    height: 1
    title: Garage
    icon: garage-open
