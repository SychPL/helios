group:
  name: Helios - Swiatla do sprawdzenia
  entities:
    - light.basement_light_1
    - light.tz3000_7ed9cqgi_ts0002_swiatlo_16
    - light.garage_light_swiatlo
    - light.garage_light_swiatlo_2
    - light.kitchen_light_all
    - light.living_room_terrace_light_swiatlo
    - light.living_room_terrace_light_swiatlo_2
    - light.garden_soffit_light_all
light_labels:
  light.basement_light_1: Piwnica
  light.tz3000_7ed9cqgi_ts0002_swiatlo_16: Piwnica
  light.garage_light_swiatlo: Garaż
  light.garage_light_swiatlo_2: Garaż
  light.kitchen_light_swiatlo: Kuchnia
  light.kitchen_light_swiatlo_2: Kuchnia
  light.living_room_terrace_light_swiatlo: Taras
  light.living_room_terrace_light_swiatlo_2: Taras
  light.garden_soffit_light_1: Podbitka
  light.tz3000_ljhbw1c9_ts0012_swiatlo_2: Podbitka
helpers:
  lights:
    name: Helios - Zapalone swiatla
    state: >-
      {% set labels = __LIGHT_LABELS__ %}
      {% set lit = expand('__LIGHT_GROUP__') | selectattr('state', 'eq', 'on') | list %}
      {% set result = namespace(rooms=[]) %}
      {% for lamp in lit %}
        {% set room = labels.get(lamp.entity_id, lamp.name) %}
        {% if room not in result.rooms %}{% set result.rooms = result.rooms + [room] %}{% endif %}
      {% endfor %}
      {{ (lit | count | string) ~ ' · ' ~ (result.rooms | join(', ')) if lit else '' }}
  openings:
    name: Helios - Otwarte do sprawdzenia
    state: >-
      {% set result = namespace(items=[]) %}
      {% set camera = states('sensor.camera_garage_garage_gate_classification') %}
      {% set garage = states('cover.brama') %}
      {% if (camera == 'close' and garage == 'open') or (camera == 'open' and garage == 'closed') %}
        {% set result.items = result.items + ['Garaż?'] %}
      {% elif camera == 'open' %}
        {% set result.items = result.items + ['Garaż (kamera)'] %}
      {% endif %}
      {% if is_state('binary_sensor.main_door_otwarcie', 'on') %}
        {% set result.items = result.items + ['Drzwi'] %}
      {% endif %}
      {% if is_state('sensor.camera_garden_blaszak_classification', 'open') %}
        {% set result.items = result.items + ['Blaszak 1'] %}
      {% endif %}
      {% if is_state('sensor.camera_garden_blaszak2_classification', 'open') %}
        {% set result.items = result.items + ['Blaszak 2'] %}
      {% endif %}
      {% if is_state('binary_sensor.basen_spa_connected', 'on') and is_state('sensor.camera_taras_basen_classification', 'open') %}
        {% set result.items = result.items + ['Basen (kamera)'] %}
      {% endif %}
      {{ result.items | join(' · ') }}
  courier:
    name: Helios - Wiking byl
    state: >-
      {% if is_state('input_boolean.night_courier_active', 'on') %}
        Wiking był · {{ as_local(states.input_boolean.night_courier_active.last_changed).strftime('%H:%M') }}
      {% endif %}
tiles:
  - id: clock
    type: clock
    column: 1
    row: 1
    width: 2
    height: 2
    title: Dom
  - id: weather
    type: weather
    entity: weather.forecast_dom
    column: 3
    row: 1
    width: 2
    height: 1
    title: Pogoda
  - id: lights-watched
    type: entity
    helper: lights
    column: 3
    row: 2
    width: 2
    height: 1
    title: Zapalone światła
    icon: lightbulb
  - id: openings
    type: entity
    helper: openings
    column: 1
    row: 3
    width: 2
    height: 1
    title: Otwarte / sprawdź
    icon: garage-open
  - id: courier
    type: entity
    helper: courier
    column: 3
    row: 3
    width: 2
    height: 1
    title: Dostawa
    icon: information
