title: Menu zegara
path: menu-zegara
type: masonry
cards:
  - type: markdown
    content: |
      Edytuj pulpit i karty **Przycisk**, aby zmieniać menu na zegarze.
      Nazwa, kolejność i akcja URL są odczytywane przez Heliosa.
      Linki `helios://` wykonuje zegar po dotknięciu jego menu; kliknięcie ich tutaj nie steruje zegarem.
  - type: grid
    columns: 3
    square: false
    cards:
      - type: button
        name: Ustawienia zegara
        icon: mdi:cog
        tap_action: {action: url, url_path: "helios://settings"}
      - type: button
        name: Dostępność / TalkBack
        icon: mdi:human
        tap_action: {action: url, url_path: "helios://accessibility"}
      - type: button
        name: Ekran główny
        icon: mdi:home
        tap_action: {action: url, url_path: "helios://home"}
      - type: button
        name: Konfiguracja ekranu w HA
        icon: mdi:tablet-dashboard
        tap_action: {action: url, url_path: "helios://dashboard"}
      - type: button
        name: Home Assistant
        icon: mdi:home-assistant
        tap_action: {action: url, url_path: "helios://ha"}
      - type: button
        name: Aktualizacja Heliosa
        icon: mdi:download
        tap_action: {action: url, url_path: "helios://update"}
      - type: button
        name: Aplikacje i launchery
        icon: mdi:apps
        tap_action: {action: url, url_path: "helios://apps"}
      - type: button
        name: Agent zegara
        icon: mdi:tools
        tap_action: {action: url, url_path: "helios://app/pl.mateusz.clockadbprobe"}
      - type: button
        name: SSH
        icon: mdi:console
        tap_action: {action: url, url_path: "helios://app/org.galexander.sshd"}
      - type: button
        name: Rozmowa
        icon: mdi:microphone
        tap_action: {action: url, url_path: "helios://talk"}
      - type: button
        name: Anuluj rozmowę
        icon: mdi:stop
        tap_action: {action: url, url_path: "helios://cancel"}
