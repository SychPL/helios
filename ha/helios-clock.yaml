# Example dashboard document for tools/publish_ha_dashboard.py.
# The entity ids are placeholders - use your own, or keep a private copy in
# .local/ha/helios-clock.yaml, which the publisher prefers when it exists.
title: Helios
helios:
  version: 2
  grid:
    columns: 4
    rows: 3
  items:
    - id: clock
      type: clock
      column: 1
      row: 1
      width: 2
      height: 2
      title: Dom

    - id: weather
      type: weather
      entity: weather.home
      column: 3
      row: 1
      width: 2
      height: 1
      title: Pogoda

    - id: garage-state
      type: entity
      entity: binary_sensor.garage_door
      column: 3
      row: 2
      width: 2
      height: 1
      title: Brama garażowa
      icon: garage-open

    # Przykłady sterowania. Odkomentuj i wpisz własne encje.
    # - id: living-room-light
    #   type: light
    #   entity: light.salon
    #   column: 1
    #   row: 3
    #   width: 1
    #   height: 1
    #   title: Salon
    #
    # - id: living-room-cover
    #   type: cover
    #   entity: cover.roleta_salon
    #   column: 2
    #   row: 3
    #   width: 1
    #   height: 1
    #   title: Roleta
    #
    # - id: garage
    #   type: garage
    #   entity: cover.brama_garazowa
    #   column: 3
    #   row: 3
    #   width: 2
    #   height: 1
    #   title: Brama otwarta
    #   visible_when:
    #     entity: binary_sensor.helios_show_open_garage_evening
    #     state: "on"
    #   confirmation:
    #     enabled: true
    #     text: Zamknąć bramę garażową?
views:
  - title: Konfiguracja
    path: konfiguracja
    cards:
      - type: markdown
        title: Konfiguracja zegara Helios
        content: |
          **Edytuj pulpit → menu ⋮ → Edytor konfiguracji tekstowej.**
          Zmieniaj sekcję `helios` na początku YAML. Zapis odświeża zegar.

          Zegar renderuje wyłącznie elementy `clock`, `weather`, `entity`, `light`,
          `cover` i `garage` z sekcji `helios` (siatka 4×3). Karty Lovelace nie są
          renderowane na zegarze. Konfiguracja wymaga Heliosa 0.5.0 i `version: 2`.
