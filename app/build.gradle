plugins { id 'com.android.application' }

android {
    namespace 'pl.mateusz.helios'
    compileSdk 35
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'pl.mateusz.helios'
        minSdk 29
        targetSdk 29
        versionCode 41
        versionName '0.17.0'
    }
    testOptions { unitTests.returnDefaultValues = true } // android.content.Intent in the JVM updater tests
    lint { disable 'ExpiredTargetSdkVersion' } // a sideloaded launcher for one Android 10 device, never Google Play; targetSdk stays 29 on purpose
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    packaging { resources.excludes += ['META-INF/versions/**', 'META-INF/DEPENDENCIES'] }
}

dependencies {
    implementation 'org.java-websocket:Java-WebSocket:1.6.0'
    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation 'org.slf4j:slf4j-nop:2.0.13'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
